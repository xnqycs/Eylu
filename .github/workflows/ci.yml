name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go test ./...
      - run: go vet ./...
      - name: Build smoke binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            go build -trimpath -o dist/eylu.exe .
          else
            go build -trimpath -o dist/eylu .
          fi
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke.ps1 -Binary ./dist/eylu.exe
      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./scripts/smoke.sh ./dist/eylu

  quality:
    name: Race and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Check third-party notices
        run: go run ./scripts/generate-third-party-notices -check
      - name: Check the invariant table against the tests it names
        run: go test ./internal/docscheck/...
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: go test -race ./...
      - name: Staticcheck
        shell: bash
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...
      # Pinned like staticcheck above: `@latest` has already resolved to a
      # version that needs a newer Go than go.mod asks for, which would quietly
      # change the toolchain this gate runs on.
      - name: Vulnerability scan
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      # The committed corpus under testdata/fuzz is already replayed by
      # `go test ./...`; this is a bounded search on top of it. A long search
      # belongs in a periodic job, not in the gate every change waits on.
      - name: Fuzz regression (30s per target)
        shell: bash
        run: |
          go test ./internal/policy -run '^$' -fuzz FuzzClassifyCommand -fuzztime 30s
          go test ./internal/policy -run '^$' -fuzz FuzzReadOnlyArgumentVerdict -fuzztime 30s
          go test ./internal/tool -run '^$' -fuzz FuzzPathResolver -fuzztime 30s
          go test ./internal/tool -run '^$' -fuzz FuzzResourceKey -fuzztime 30s
      # A floor is raised by adding tests and never lowered to make a build pass;
      # the tool refuses to lower one, so lowering it is an explicit edit to the
      # committed file rather than a flag someone reaches for.
      - name: Coverage floor
        run: go run ./scripts/check-coverage
