version: 2

project_name: Eylu

before:
  hooks:
    - go mod verify

builds:
  - id: eylu
    main: .
    binary: eylu
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X Eylu/internal/buildinfo.Version={{ .Version }}
        -X Eylu/internal/buildinfo.Commit={{ .Commit }}
        -X Eylu/internal/buildinfo.Date={{ .CommitDate }}
        -X Eylu/internal/buildinfo.BuiltBy=goreleaser
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: eylu
    ids:
      - eylu
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "Eylu_{{ .Version }}_{{ title .Os }}_{{ .Arch }}"
    files:
      # A non-matching glob prevents GoReleaser from adding its default README/LICENSE files.
      - __eylu_binary_only__*

checksum:
  name_template: Eylu_{{ .Version }}_checksums.txt
  algorithm: sha256

# An SBOM says what is inside the artifact, which is the half the signature cannot
# tell you: a signature proves a release was not tampered with after it was built,
# and says nothing about whether what was built contains a dependency with a known
# vulnerability. syft writes one per archive, in the format the ecosystem reads.
sboms:
  - id: eylu-archive
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "spdx-json=$document"

signs:
  - id: checksum-cosign
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
  # The SBOM is signed with the same identity as the checksums, so a reader can
  # verify it is the one the release published rather than one supplied alongside.
  - id: sbom-cosign
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    artifacts: sbom
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      # A conventional-commit subject may carry a scope - `docs(changelog): ...`,
      # `fix(ui): ...` - so the scope is part of the pattern. Without it `^docs:`
      # excludes only the unscoped form and lets the scoped one into the published
      # notes, which is how release notes v1.0.0-rc.5 ended up listing chore and docs
      # commits that this list says are excluded.
      - '^docs(\([^)]*\))?:'
      - '^test(\([^)]*\))?:'
      - '^chore(\([^)]*\))?:'
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch

release:
  draft: true
  replace_existing_draft: true
  prerelease: auto
